<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redéploiement Manuel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-md max-w-md w-full">
        <h1 class="text-2xl font-bold mb-6 text-center">Mettre à jour le site</h1>
        
        <div class="space-y-4">
            <p class="text-gray-600 text-center">
                Cliquez sur ce bouton après avoir modifié des données dans PocketBase
            </p>
            
            <button 
                onclick="triggerDeploy()"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded transition duration-200"
                id="deployBtn"
            >
                🚀 Redéployer le site
            </button>
            
            <div id="status" class="text-center"></div>
        </div>
    </div>

    <script>
        async function triggerDeploy() {
            const btn = document.getElementById('deployBtn');
            const status = document.getElementById('status');
            
            // Remplacez cette URL par votre Deploy Hook Vercel
            const DEPLOY_HOOK = 'https://api.vercel.com/v1/integrations/deploy/VOTRE_HOOK_ID';
            
            try {
                btn.disabled = true;
                btn.textContent = '⏳ Déploiement en cours...';
                status.innerHTML = '<p class="text-blue-600">Déclenchement du redéploiement...</p>';
                
                const response = await fetch(DEPLOY_HOOK, {
                    method: 'POST'
                });
                
                if (response.ok) {
                    status.innerHTML = '<p class="text-green-600">✅ Redéploiement déclenché avec succès!</p>';
                    setTimeout(() => {
                        status.innerHTML = '<p class="text-gray-500">Attendez 2-3 minutes pour voir les changements</p>';
                    }, 2000);
                } else {
                    throw new Error('Erreur de déploiement');
                }
            } catch (error) {
                status.innerHTML = '<p class="text-red-600">❌ Erreur lors du déploiement</p>';
                console.error(error);
            } finally {
                setTimeout(() => {
                    btn.disabled = false;
                    btn.textContent = '🚀 Redéployer le site';
                }, 3000);
            }
        }
    </script>
</body>
</html>
