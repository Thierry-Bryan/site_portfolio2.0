name: 🚀 Auto-Deploy to IONOS VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: 📦 Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📄 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Create .env file
        run: |
          echo "POCKETBASE_URL=https://pocketbase-portfolio-production.up.railway.app" > .env
          echo "PUBLIC_POCKETBASE_URL=https://pocketbase-portfolio-production.up.railway.app" >> .env

      - name: 🏗️ Build application
        run: npm run build

      - name: 🚀 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Créer le dossier s'il n'existe pas
            mkdir -p /var/www/portfolio

            # Arrêter PM2 temporairement
            pm2 stop portfolio || true

            # Nettoyer l'ancien build
            rm -rf /var/www/portfolio/*

      - name: 📤 Upload dist folder
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*"
          target: "/var/www/portfolio"
          strip_components: 1

      - name: 📤 Upload package files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "package.json,package-lock.json"
          target: "/var/www/portfolio"

      - name: � Configure Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Configuration nginx pour reverse proxy
            cat > /etc/nginx/sites-available/portfolio << 'NGINX_EOF'
            server {
                listen 80;
                listen [::]:80;
                server_name 87.106.23.57;
                
                # Servir les assets statiques directement
                location /_astro/ {
                    root /var/www/portfolio/client;
                    expires 1y;
                    add_header Cache-Control "public, immutable";
                    try_files $uri =404;
                }
                
                location /favicon.svg {
                    root /var/www/portfolio/client;
                    expires 1y;
                    add_header Cache-Control "public, immutable";
                }
                
                # Assets publics
                location ~* \.(webp|png|jpg|jpeg|svg|css|js|ico)$ {
                    root /var/www/portfolio/client;
                    expires 1y;
                    add_header Cache-Control "public, immutable";
                    try_files $uri =404;
                }
                
                # Proxy vers l'application Node.js
                location / {
                    proxy_pass http://127.0.0.1:4321;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_cache_bypass $http_upgrade;
                    proxy_redirect off;
                }
            }
            NGINX_EOF

            # Activer le site
            ln -sf /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
            rm -f /etc/nginx/sites-enabled/default

            # Test et reload nginx
            nginx -t && systemctl reload nginx

      - name: �🔄 Install dependencies and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/portfolio

            # Installer seulement les dépendances de production
            npm ci --omit=dev

            # Créer .env pour production
            echo "POCKETBASE_URL=https://pocketbase-portfolio-production.up.railway.app" > .env
            echo "PUBLIC_POCKETBASE_URL=https://pocketbase-portfolio-production.up.railway.app" >> .env
            
            # Redémarrer avec PM2 (port 4321 pour Astro server)
            pm2 delete portfolio || true
            cd /var/www/portfolio
            pm2 start server/entry.mjs --name "portfolio" -- --host 0.0.0.0 --port 4321
            pm2 save
            
            # Vérifier que l'app démarre bien
            sleep 5
            pm2 status
            pm2 logs portfolio --lines 10
