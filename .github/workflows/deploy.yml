name: 🚀 Auto-Deploy to IONOS VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: 📦 Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📄 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Create .env file
        run: |
          echo "POCKETBASE_URL=https://pocketbase-portfolio-production.up.railway.app" > .env
          echo "PUBLIC_POCKETBASE_URL=https://pocketbase-portfolio-production.up.railway.app" >> .env

      - name: 🏗️ Build application
        run: npm run build

      - name: 🚀 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Créer le dossier s'il n'existe pas
            mkdir -p /var/www/portfolio
            
            # Nettoyer l'ancien build
            rm -rf /var/www/portfolio/*

      - name: 📤 Upload build files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*"
          target: "/var/www/portfolio"
          strip_components: 1

      - name: 🔄 Restart application with PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/portfolio
            
            # Copier package.json si nécessaire
            # (à adapter selon ton projet)
            
            # Redémarrer avec PM2
            pm2 restart portfolio || pm2 start npm --name "portfolio" -- run preview -- --host 0.0.0.0 --port 3000
            
            # Sauvegarder la config PM2
            pm2 save

      - name: ✅ Deploy completed
        run: echo "✅ Deployment to IONOS VPS completed successfully!"
