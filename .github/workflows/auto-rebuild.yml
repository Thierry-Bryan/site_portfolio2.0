name: Auto Rebuild - Scheduled & Webhook

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [pocketbase-update]
  schedule:
    # Rebuild automatique toutes les 2 minutes pour réactivité maximale
    - cron: '*/2 * * * *'
  workflow_dispatch:
    # Permet de déclencher manuellement

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          POCKETBASE_URL: ${{ secrets.POCKETBASE_URL }}

      - name: Create underscore directory and copy redirect
        run: |
          mkdir -p ./dist/_
          cp ./public/_redirect.html ./dist/_/index.html

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./sites/portfolio.bryan-thierry.fr/ 
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            
      - name: Notify deployment success
        run: |
          echo "✅ Site déployé avec succès sur Infomaniak"
          echo "📅 $(date)"
          echo "🔗 https://portfolio.bryan-thierry.fr"
          echo "🚀 Triggered by: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "🎯 Webhook PocketBase détecté !"
          fi