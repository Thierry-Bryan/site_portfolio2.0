name: 🚀 Auto-Deploy to Infomaniak Node.js

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: 📦 Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy to Infomaniak Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.INFOMANIAK_HOST }}
          username: ${{ secrets.INFOMANIAK_USER }}
          key: ${{ secrets.INFOMANIAK_SSH_KEY }}
          port: ${{ secrets.INFOMANIAK_PORT || 22 }}
          timeout: 120s
          script: |
            echo "🔄 Starting deployment..."

            cd /srv/customer/sites/portfolio.bryan-thierry.fr || { echo "❌ Directory not found"; exit 1; }

            if [ ! -d ".git" ]; then
              echo "📥 Cloning repository..."
              rm -rf * .[^.]*
              git clone https://github.com/Thierry-Bryan/site_portfolio2.0.git . || { echo "❌ Git clone failed"; exit 1; }
            else
              echo "📥 Pulling latest changes..."
              git pull origin main || { echo "❌ Git pull failed"; exit 1; }
            fi

            echo "📦 Installing dependencies..."
            npm install || { echo "❌ npm install failed"; exit 1; }

            echo "🔧 Creating .env file..."
            cat > .env << 'ENV_EOF'
# URL de ton instance PocketBase
POCKETBASE_URL=https://pocketbase-portfolio-production.up.railway.app
PUBLIC_POCKETBASE_URL=https://pocketbase-portfolio-production.up.railway.app
ENV_EOF

            echo "🏗️ Building application..."
            npm run build || { echo "❌ Build failed"; exit 1; }

            echo "🔄 Restarting application..."
            pkill -f "node" || echo "No processes found"
            sleep 3

            # Démarrer avec les bonnes variables d'environnement
            nohup bash -c 'HOST=0.0.0.0 PORT=4321 node dist/server/entry.mjs' > app.log 2>&1 &
            sleep 2

            echo "✅ Deployment completed!"
            echo "🌍 Site available at: https://portfolio.bryan-thierry.fr"
