name: 🚀 Auto-Deploy to Infomaniak Node.js

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: 📦 Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: � Checkout code
        uses: actions/checkout@v4

      - name: 📄 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Create .env file
        run: |
          echo "POCKETBASE_URL=https://pocketbase-portfolio-production.up.railway.app" > .env
          echo "PUBLIC_POCKETBASE_URL=https://pocketbase-portfolio-production.up.railway.app" >> .env

      - name: 🏗️ Build application
        run: npm run build

      - name: 🚀 Trigger deploy webhook
        run: |
          curl -X POST "https://portfolio.bryan-thierry.fr/webhook-deploy" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            -d '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'
