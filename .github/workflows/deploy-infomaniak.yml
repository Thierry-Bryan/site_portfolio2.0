name: 🚀 Auto-Deploy to Infomaniak Node.js

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: 📦 Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: � Checkout code
        uses: actions/checkout@v4

      - name: 📄 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Create .env file
        run: |
          echo "POCKETBASE_URL=https://pocketbase-portfolio-production.up.railway.app" > .env
          echo "PUBLIC_POCKETBASE_URL=https://pocketbase-portfolio-production.up.railway.app" >> .env

      - name: 🏗️ Build application
        run: npm run build

      - name: 🚀 SSH Deploy - exactly like deploy.ps1
        run: |
          # Install expect for interactive SSH
          sudo apt-get update && sudo apt-get install -y expect
          
          # Create expect script
          cat > ssh_deploy.exp << 'EOF'
          #!/usr/bin/expect -f
          set timeout 300
          spawn ssh Hr2eaRMsArq_bryan_portfolio@57-106538.ssh.hosting-ik.com
          expect "password:"
          send "$env(SSH_PASSWORD)\r"
          expect "$ "
          send "cd /srv/customer/sites/portfolio.bryan-thierry.fr\r"
          expect "$ "
          send "git pull origin main\r"
          expect "$ "
          send "echo \"POCKETBASE_URL=https://pocketbase-portfolio-production.up.railway.app\" > .env\r"
          expect "$ "
          send "echo \"PUBLIC_POCKETBASE_URL=https://pocketbase-portfolio-production.up.railway.app\" >> .env\r"
          expect "$ "
          send "npm install\r"
          expect "$ "
          send "npm run build\r"
          expect "$ "
          send "pkill -f \"node\" || echo \"No processes found\"\r"
          expect "$ "
          send "sleep 2\r"
          expect "$ "
          send "nohup bash -c 'HOST=0.0.0.0 PORT=4321 node dist/server/entry.mjs' > app.log 2>&1 &\r"
          expect "$ "
          send "echo \"✅ Déploiement terminé!\"\r"
          expect "$ "
          send "exit\r"
          expect eof
          EOF
          
          # Run SSH deploy
          chmod +x ssh_deploy.exp
          SSH_PASSWORD="${{ secrets.INFOMANIAK_PASSWORD }}" ./ssh_deploy.exp
