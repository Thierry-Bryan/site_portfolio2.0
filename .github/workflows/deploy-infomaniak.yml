name: 🚀 Auto-Deploy to Infomaniak Node.js

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: 📦 Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: � Checkout code
        uses: actions/checkout@v4

      - name: 📄 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Create .env file
        run: |
          echo "POCKETBASE_URL=https://pocketbase-portfolio-production.up.railway.app" > .env
          echo "PUBLIC_POCKETBASE_URL=https://pocketbase-portfolio-production.up.railway.app" >> .env

      - name: 🏗️ Build application
        run: npm run build

      - name: 🚀 Deploy files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /srv/customer/sites/portfolio.bryan-thierry.fr/
          exclude: |
            **/node_modules/**

      - name: ✅ Deploy completed
        run: echo "✅ Files deployed successfully!"
